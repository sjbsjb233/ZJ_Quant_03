[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-service"
version = "0.1.0"
description = "ZJ Quant — factor service (FastAPI + SQLite-backed queue + dispatcher)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pyjwt>=2.8",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyarrow>=15.0",
    "polars>=1.0",
    "quant-data>=0.2.0",
    "quant-factor>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["factor_service*"]
