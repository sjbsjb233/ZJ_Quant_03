# Single-container deployment: FastAPI serves the API + the built SPA.
# Jobs run in-process (no Redis required). Data + audit DB persist in a volume.
services:
  web:
    build:
      context: ../../              # repo root — Dockerfile COPYs packages/ + apps/web/backend/
      dockerfile: apps/web/Dockerfile
    ports:
      - "8000:8000"
    environment:
      QUANT_DATA_ROOT: /data
      AUDIT_DB_URL: sqlite:////data/quant_web_audit.db
      FRONTEND_DIST: /app/frontend/dist
      ALLOWED_ORIGINS: http://localhost:8000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      SEED_DEFAULT_USERS: "true"
      # === logging platform (全链路日志方案 v2.0 §15.2) — reuses the /data volume ===
      LOG_LEVEL: INFO
      LOG_TO_DB: "true"
      LOG_TO_FILE: "true"
      LOG_FILE_DIR: /data/logs
      LOG_FILE_MAX_MB: "100"
      LOG_FILE_BACKUP_COUNT: "10"
      LOG_DB_RETENTION_DAYS: "30"
    volumes:
      - quant_data:/data         # single volume carries data + audit DB + app_log + /data/logs

volumes:
  quant_data:
# Run from apps/web/. First seed a demo world:
#   cd apps/web && docker compose run --rm web python -m quant_web.seed_demo
# Then:
#   cd apps/web && docker compose up
# Open http://localhost:8000  (admin / admin123)
