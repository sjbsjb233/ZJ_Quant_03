# ZJ Quant — 容器化重构 V3 五容器拓扑 (单文档 §3.1 / §8.2)。
#
#   web-frontend  唯一公网入口 (nginx: SPA 静态 + 反代 /api)
#   web-backend   网关 / 鉴权 / 审计 / 日志中枢 / 读控制台 (/data:ro)
#   data-keeper   唯一写者 (/data:rw): 写命令 API + 进程内 JobRunner + 进程内调度
#   factor-api    因子查询 (/data:ro)
#   factor-worker 因子计算 (/data:ro)
#
# 读 = 库 (web/factor 挂 :ro 直读)；写 = 服务 (只有 data-keeper 挂 :rw)。
# app_log / audit 只被 web-backend 写 (./state)；各服务日志写各自 ./logs/<svc>。
#
# 数据 / 状态分离 (V3 §3.3)：
#   ./data        原始数据湖 (data-keeper :rw, 其余 :ro)
#   ./state       web-backend 独占：audit / app_log SQLite + duckdb temp + 日志 JSONL
#   ./logs/<svc>  各服务本地 JSONL 兜底
#
# 首次启动 (重建演示世界 + 演示用户)：
#   docker compose run --rm data-keeper python -m keeper_service.seed_demo
#   docker compose run --rm web-backend python -m quant_web.seed_users
#   docker compose up --build
#   open http://localhost:${WEB_PORT:-80}   (admin / admin123)
services:
  # ── 唯一公网入口 ─────────────────────────────────────────────
  web-frontend:
    build:
      context: ../../
      dockerfile: apps/web/frontend/Dockerfile
    image: ${WEB_FRONTEND_IMAGE:-zj-quant-web-frontend:local}
    container_name: zj-quant-web-frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - web-backend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ── 网关 + 鉴权 + 审计 + 日志中枢 + 读控制台 ──────────────────
  web-backend:
    build:
      context: ../../
      dockerfile: apps/web/backend/Dockerfile
    image: ${WEB_BACKEND_IMAGE:-zj-quant-web-backend:local}
    container_name: zj-quant-web-backend
    restart: unless-stopped
    # Container-level OOM containment for the read console's big table scans.
    mem_limit: 12g
    memswap_limit: 12g
    depends_on:
      - data-keeper
      - factor-api
    environment:
      QUANT_DATA_ROOT: /data
      # 写转发目标；未设则回退本地写 (回滚开关, V3 §8.1)
      KEEPER_BASE: http://data-keeper:8300
      FACTOR_API_BASE: http://factor-api:8100
      AUDIT_DB_URL: sqlite:////state/quant_web_audit.db
      # DuckDB 读护栏：超限报错而非 OOM；spill 到可写卷
      QUANT_DUCKDB_MEMORY_LIMIT: "2GB"
      QUANT_DUCKDB_TEMP_DIR: /state/duck_tmp
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      SEED_DEFAULT_USERS: "true"
      # 服务级日志上报令牌 (接收 data-keeper / factor 的 /logs/ingest)
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN:-change-me-log-token}
      LOG_LEVEL: INFO
      LOG_TO_DB: "true"
      LOG_TO_FILE: "true"
      LOG_FILE_DIR: /state/logs
      LOG_DB_RETENTION_DAYS: "30"
      NO_PROXY: "localhost,127.0.0.1"
      no_proxy: "localhost,127.0.0.1"
    volumes:
      - ./data:/data:ro          # 读控制台,只读 (写者唯一)
      - ./state:/state           # app_log/audit/duck temp/日志 JSONL (可写)
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ── 数据策管 (唯一写者, 单容器: 写命令 API + 进程内 JobRunner + 进程内调度) ──
  data-keeper:
    build:
      context: ../../
      dockerfile: apps/data-keeper/Dockerfile
    image: ${DATA_KEEPER_IMAGE:-zj-quant-data-keeper:local}
    container_name: zj-quant-data-keeper
    restart: unless-stopped
    environment:
      QUANT_DATA_ROOT: /data
      KEEPER_DB_URL: sqlite:////keeper-store/keeper.db
      ENABLE_SCHEDULER: "${ENABLE_SCHEDULER:-true}"   # 进程内调度线程; 设 false 即关 (回滚位)
      TZ: Asia/Shanghai                               # 调度按本地时区
      TRUST_PROXY_USER_HEADERS: "true"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      LOG_LEVEL: INFO
      LOG_FILE_DIR: /logs
      LOG_INGEST_URL: http://web-backend:8000/api/v1/logs/ingest
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN:-change-me-log-token}
      # tushare 备源 token (akshare 主源无需 token)
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
    volumes:
      - ./data:/data                     # 全系统唯一写者：读写
      - keeper_store:/keeper-store       # keeper.db (Job/调度队列, WAL)
      - ./logs/keeper:/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8300/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # 重型写 (compaction/migration/vacuum) 跑在进程内 ThreadPoolExecutor；
    # 定时任务由进程内调度线程投递。单写者=单实例,进程内 cron 不会重复触发。
    # 将来若需把重型写拆成独立 worker 容器 (V3 §4.2.1),同一镜像加：
    #   command: ["python", "-m", "keeper_service.jobs.dispatcher"]

  # ── 因子查询 (现状不变, 仅加日志上报) ────────────────────────
  factor-api:
    build:
      context: ../../
      dockerfile: apps/factor/Dockerfile
    image: ${FACTOR_IMAGE:-zj-quant-factor:local}
    container_name: zj-quant-factor-api
    restart: unless-stopped
    depends_on:
      - data-keeper
    environment:
      QUANT_DATA_ROOT: /data
      FACTOR_STORE_ROOT: /factor-store
      FACTOR_DB_URL: sqlite:////factor-store/factor.db
      FACTOR_ROLE: api
      TRUST_PROXY_USER_HEADERS: "true"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      LOG_LEVEL: INFO
      LOG_FILE_DIR: /logs
      LOG_INGEST_URL: http://web-backend:8000/api/v1/logs/ingest
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN:-change-me-log-token}
    volumes:
      - ./data:/data:ro
      - factor_store:/factor-store
      - ./logs/factor:/logs
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ── 因子计算 (worker) ────────────────────────────────────────
  factor-worker:
    build:
      context: ../../
      dockerfile: apps/factor/Dockerfile
    image: ${FACTOR_IMAGE:-zj-quant-factor:local}
    container_name: zj-quant-factor-worker
    command: ["python", "-m", "factor_service.queue.dispatcher"]
    restart: unless-stopped
    depends_on:
      - factor-api
    environment:
      QUANT_DATA_ROOT: /data
      FACTOR_STORE_ROOT: /factor-store
      FACTOR_DB_URL: sqlite:////factor-store/factor.db
      FACTOR_ROLE: worker
      FACTOR_CONCURRENCY: ${FACTOR_CONCURRENCY:-4}
      FACTOR_RESERVE_INTERACTIVE: ${FACTOR_RESERVE_INTERACTIVE:-1}
      FACTOR_POLL_INTERVAL_MS: ${FACTOR_POLL_INTERVAL_MS:-1000}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      LOG_LEVEL: INFO
      LOG_FILE_DIR: /logs
      LOG_INGEST_URL: http://web-backend:8000/api/v1/logs/ingest
      LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN:-change-me-log-token}
    volumes:
      - ./data:/data:ro
      - factor_store:/factor-store
      - ./logs/factor:/logs
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ── 生产自动更新 (profile) ───────────────────────────────────
  watchtower:
    image: containrrr/watchtower:latest
    container_name: zj-quant-watchtower
    profiles: ["production"]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      TZ: "Asia/Shanghai"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_ROLLING_RESTART: "true"

volumes:
  keeper_store:
  factor_store:
