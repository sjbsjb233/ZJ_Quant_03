# web-frontend nginx (容器化重构 V3 §5.2 + 可观测层重构方案 §6.3). Only public entry:
#   /        -> SPA static assets (history-mode fallback to index.html)
#   /api/    -> reverse-proxy to web-backend (single origin → Cookie/CORS unchanged)
#   /obs/    -> reverse-proxy to obs-sentinel:8400 (心跳/基建状态帧 SSE, 绕开 backend)
# Critically, /api and /obs buffering is OFF so the SSE streams flow in real time.
server {
    listen 80;
    server_name _;

    # Docker 内嵌 DNS (127.0.0.11)。配合下面 proxy_pass 走变量, 强制每请求重解析:
    # web-backend / obs-sentinel 被重建 (部署更新 / OOM 重启 / watchtower 滚动重启)
    # 会换 IP, 字面量 proxy_pass 只在启动时解析一次 → 缓存死 IP → 502, 必须重启
    # web-frontend 才恢复 (stale-upstream P2)。变量 + resolver 让 nginx 重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA static + client-side routing fallback.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy — same origin as the SPA, so the browser only ever sees
    # web-frontend and cookies/JWT/CORS are unchanged (V3 §5.3).
    location /api/ {
        # 变量形式 → 每请求经 resolver 重解析, 不缓存启动时 IP (避免重建后 502)。
        set $api_upstream http://web-backend:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/api/v1/logs/stream, /api/v1/runs/.../logs/stream) must not buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    # 第一层 · 哨兵状态帧 (可观测层重构方案 §6.3). 绕开 web-backend → web-backend 崩了
    # 状态栏仍能从哨兵 SSE 收到「backend 不可达」并标红。哨兵只读、只 GET、JWT 本地校验。
    location /obs/ {
        # 同 /api/: 变量 + resolver, 哨兵重建换 IP 后无需重启 web-frontend。
        set $obs_upstream http://obs-sentinel:8400;
        proxy_pass $obs_upstream;
        proxy_set_header Host $host;
        # SSE 友好: 关缓冲, 长超时, 升级 HTTP/1.1 并清空 Connection 头 (周期心跳帧防断连)。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }
}
