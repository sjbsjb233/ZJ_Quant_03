# web-frontend nginx (容器化重构 V3 §5.2). The only public entry point:
#   /        -> SPA static assets (history-mode fallback to index.html)
#   /api/    -> reverse-proxy to web-backend (single origin → Cookie/CORS unchanged)
# Critically, /api buffering is OFF so the SSE log/run streams flow in real time.
server {
    listen 80;
    server_name _;

    # SPA static + client-side routing fallback.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy — same origin as the SPA, so the browser only ever sees
    # web-frontend and cookies/JWT/CORS are unchanged (V3 §5.3).
    location /api/ {
        proxy_pass http://web-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/api/v1/logs/stream, /api/v1/runs/.../logs/stream) must not buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }
}
