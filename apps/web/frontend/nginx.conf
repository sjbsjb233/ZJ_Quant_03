# web-frontend nginx (容器化重构 V3 §5.2 + 可观测层重构方案 §6.3). Only public entry:
#   /        -> SPA static assets (history-mode fallback to index.html)
#   /api/    -> reverse-proxy to web-backend (single origin → Cookie/CORS unchanged)
#   /obs/    -> reverse-proxy to obs-sentinel:8400 (心跳/基建状态帧 SSE, 绕开 backend)
# Critically, /api and /obs buffering is OFF so the SSE streams flow in real time.
server {
    listen 80;
    server_name _;

    # SPA static + client-side routing fallback.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy — same origin as the SPA, so the browser only ever sees
    # web-frontend and cookies/JWT/CORS are unchanged (V3 §5.3).
    location /api/ {
        proxy_pass http://web-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/api/v1/logs/stream, /api/v1/runs/.../logs/stream) must not buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    # 第一层 · 哨兵状态帧 (可观测层重构方案 §6.3). 绕开 web-backend → web-backend 崩了
    # 状态栏仍能从哨兵 SSE 收到「backend 不可达」并标红。哨兵只读、只 GET、JWT 本地校验。
    location /obs/ {
        proxy_pass http://obs-sentinel:8400;
        proxy_set_header Host $host;
        # SSE 友好: 关缓冲, 长超时, 升级 HTTP/1.1 并清空 Connection 头 (周期心跳帧防断连)。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }
}
