# deploy/docker-compose.yml — 唯一权威编排 (容器化重构 V3 · 五容器拓扑 · 附录 A)。
#
# 远程服务器只维护这一份 + .env。所有持久化都在本目录的 bind 子目录里,
# 备份/迁移 = 拷一个 deploy/ 目录 (见 README.md)。
#
#   web-frontend   唯一公网入口 (nginx: SPA 静态 + 反代 /api)
#   web-backend    网关 / 鉴权 / 审计 / 日志中枢 / 读控制台 (/data:ro) + 监控评估器
#   data-keeper    唯一写者 (/data:rw): 写命令 API + 进程内 JobRunner + 进程内调度 + 对账/回收
#   factor-api     因子查询 (/data:ro)
#   factor-worker  因子计算 (/data:ro)
#   obs-sentinel   进程哨兵 / 外部观察 (旁路, docker.sock:ro): OOM/重启/健康/内存 → /monitor/signals
#
# 监控 / 外部观察层 (可观测层重构方案)：哨兵 (外部观察) + keeper 自对账/回收 (内部自报) +
# web-backend 评估器 (症状/死人开关/告警生命周期)。哨兵只读 docker.sock、只 POST 结果,最小权限。
#
# 读 = 库 (web/factor 挂 :ro 直读 parquet)；写 = 服务 (只有 data-keeper 挂 :rw)。
# app_log / audit 只被 web-backend 写 (./state)；各服务本地 JSONL 写各自 ./logs/<svc>。
#
# 存储统一 (V3 §2.2)：原命名卷 keeper_store / factor_store 已改为部署目录下的
#   ./keeper-store / ./factor-store bind —— 全状态自包含,无隐藏命名卷。
#
# 镜像来源：默认拉 GHCR (CI publish-image.yml 按服务 matrix 推送 4 个镜像)。
#   服务器无源码,只拉镜像。需本地构建时叠加 docker-compose.dev.yml (含 build:)。
#
# 首次启动 (重建演示世界 + 演示用户 + 拉起栈)：见 README.md / 附录 C。
name: zj-quant                         # 固定项目名：卷/网络名恒为 zj-quant_*,不随目录变

# ── 各服务共享的日志环境 (DRY: YAML 锚点, 附录 A) ─────────────────────────
x-logging-env: &logging-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_INGEST_URL: http://web-backend:8000/api/v1/logs/ingest
  LOG_INGEST_TOKEN: ${LOG_INGEST_TOKEN:-change-me-log-token}

services:
  # ── 唯一公网入口 ─────────────────────────────────────────────
  web-frontend:
    image: ${WEB_FRONTEND_IMAGE:-ghcr.io/OWNER/REPO/web-frontend:latest}
    container_name: zj-quant-web-frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      # nginx /obs/ 反代 obs-sentinel:8400 (状态帧 SSE); /api/ 反代 web-backend。
      - web-backend
      - obs-sentinel
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ── 网关 + 鉴权 + 审计 + 日志中枢 + 读控制台 ──────────────────
  web-backend:
    image: ${WEB_BACKEND_IMAGE:-ghcr.io/OWNER/REPO/web-backend:latest}
    container_name: zj-quant-web-backend
    restart: unless-stopped
    # Container-level OOM containment for the read console's big table scans.
    mem_limit: 12g
    memswap_limit: 12g
    # CPU 上限:防止全表去重排序把宿主所有核打满 → 健康检查/轻请求饿死
    # (2026-06-01 P0:最轻的 lookup 排队 7.9s)。按宿主核数预留余量调整。
    cpus: ${WEB_BACKEND_CPUS:-4}
    # 关闭 core dump:崩溃不再向容器 /app(→ 宿主 /)写出数十 G 的 core,
    # 从根上切断「崩溃 → 写爆系统盘」这条路径(2026-06-01 P0 直接原因)。
    ulimits:
      core: 0
    depends_on:
      - data-keeper
      - factor-api
    environment:
      <<: *logging-env
      QUANT_DATA_ROOT: /data
      # 部署标识 (修复 A1/A2)：顶栏环境徽标 + 状态栏右侧 cluster·env 标签。
      ENVIRONMENT: ${ENVIRONMENT:-PROD}
      CLUSTER: ${CLUSTER:-prod-east-1}
      # 写转发目标；未设则回退本地写 (回滚开关, V3 §8.1)
      KEEPER_BASE: http://data-keeper:8300
      FACTOR_API_BASE: http://factor-api:8100
      AUDIT_DB_URL: sqlite:////state/quant_web_audit.db
      # DuckDB 读护栏：超限报错而非 OOM；spill 到可写卷
      QUANT_DUCKDB_MEMORY_LIMIT: "2GB"
      QUANT_DUCKDB_TEMP_DIR: /state/duck_tmp
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      SEED_DEFAULT_USERS: "true"
      LOG_TO_DB: "true"
      LOG_TO_FILE: "true"
      LOG_FILE_DIR: /state/logs
      LOG_DB_RETENTION_DAYS: ${LOG_DB_RETENTION_DAYS:-30}
      # 分层日志可见性 (V3 §4.2 + 可观测层方案 §6.1)：editor 现也可见 monitor 层。
      LOG_VISIBLE_SOURCES: ${LOG_VISIBLE_SOURCES:-editor:data,factor,backend,frontend,monitor;viewer:frontend}
      # 监控 / 外部观察层 (可观测层重构方案 §6.7)：评估器 + 哨兵信号接收 + 告警 webhook。
      MONITOR_ENABLED: "${MONITOR_ENABLED:-true}"
      MONITOR_SIGNALS_TOKEN: ${LOG_INGEST_TOKEN:-change-me-log-token}   # 哨兵 /monitor/signals 令牌 (复用)
      MONITOR_EVAL_TICK_SEC: ${MONITOR_EVAL_TICK_SEC:-30}
      DEADMAN_HOURS: ${DEADMAN_HOURS:-25}
      ERR_RATE_WARN: ${ERR_RATE_WARN:-10}
      ERR_RATE_CRIT: ${ERR_RATE_CRIT:-50}
      LAYER_SILENCE_MIN: ${LAYER_SILENCE_MIN:-data=20,factor=30,backend=15}
      LOG_ALERT_WEBHOOK: ${LOG_ALERT_WEBHOOK:-}                          # opt-in 钉钉/企业微信 robot
      MONITOR_ALERT_MIN_LEVEL: ${MONITOR_ALERT_MIN_LEVEL:-error}
      # 哨兵新检测器阈值 (规则页渲染默认值, 与哨兵 env 同名同步, §6.5/§9.2)
      DISK_WARN_PCT: ${DISK_WARN_PCT:-85}
      DISK_CRIT_PCT: ${DISK_CRIT_PCT:-95}
      CPU_SAT_PCT: ${CPU_SAT_PCT:-90}
      CPU_SAT_FOR_SEC: ${CPU_SAT_FOR_SEC:-120}
      CORE_DUMP_RW_GB: ${CORE_DUMP_RW_GB:-2}
      LIVENESS_PROBE_TIMEOUT_SEC: ${LIVENESS_PROBE_TIMEOUT_SEC:-2}
      # 哨兵 conditions 新鲜度门 (盲时停喂, §6.5)
      SIGNAL_FRESH_SEC: ${SIGNAL_FRESH_SEC:-120}
      # JSONL → app_log 回填自愈 (§8.3②): 启动后扫描各层本地 JSONL 补齐宕机缺口。
      # /backfill 是各层 ./logs 的只读挂入 (见 volumes); log_file_dir(/state/logs) 总会扫。
      LOG_BACKFILL_ON_START: ${LOG_BACKFILL_ON_START:-true}
      LOG_BACKFILL_DIRS: ${LOG_BACKFILL_DIRS:-/backfill/keeper;/backfill/factor;/backfill/sentinel}
      LOG_BACKFILL_SINCE_HOURS: ${LOG_BACKFILL_SINCE_HOURS:-48}
      NO_PROXY: "localhost,127.0.0.1"
      no_proxy: "localhost,127.0.0.1"
    volumes:
      - ./data:/data:ro          # 读控制台,只读 (写者唯一)
      - ./state:/state           # app_log/audit/duck temp/日志 JSONL (可写)
      - ./logs:/backfill:ro      # 各层本地 JSONL 只读挂入, 供回填自愈扫描 (§8.3②)
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ── 数据策管 (唯一写者, 单容器: 写命令 API + 进程内 JobRunner + 进程内调度) ──
  data-keeper:
    image: ${DATA_KEEPER_IMAGE:-ghcr.io/OWNER/REPO/data-keeper:latest}
    container_name: zj-quant-data-keeper
    restart: unless-stopped
    # Container-level OOM containment for heavy writes (compaction/migration).
    # memswap_limit == mem_limit disables swap so a runaway gets killed promptly
    # instead of thrashing. Tunable via env (see .env.example).
    mem_limit: ${DATA_KEEPER_MEM_LIMIT:-8g}
    memswap_limit: ${DATA_KEEPER_MEM_LIMIT:-8g}
    # 关闭 core dump:崩溃只重启,不向宿主系统盘写出数十 G 的 core (2026-06-01 P0)。
    ulimits:
      core: 0
    environment:
      <<: *logging-env
      QUANT_DATA_ROOT: /data
      # DuckDB 内存护栏：超限 spill 到 sdb(/keeper-store 在 10TB 盘)而非 OOM。
      QUANT_DUCKDB_MEMORY_LIMIT: ${KEEPER_DUCKDB_MEMORY_LIMIT:-2GB}
      QUANT_DUCKDB_TEMP_DIR: /keeper-store/duck_tmp
      KEEPER_DB_URL: sqlite:////keeper-store/keeper.db
      ENABLE_SCHEDULER: "${ENABLE_SCHEDULER:-true}"   # 进程内调度线程; 设 false 即关 (回滚位)
      TZ: Asia/Shanghai                               # 调度按本地时区
      TRUST_PROXY_USER_HEADERS: "true"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      LOG_FILE_DIR: /logs
      # 任务自对账 / 回收 (可观测层重构方案 §6.5 · D5/D6)：进程猝死后启动翻孤儿、
      # 回收线程清卡死，主动造 ERROR 让中枢感知 (默认开)。
      RECONCILE_ON_START: "${RECONCILE_ON_START:-true}"
      JOB_TIMEOUT_MIN: ${JOB_TIMEOUT_MIN:-{"maintenance":15,"quality":10,"crawl":30,"default":20}}
      JOB_HEARTBEAT_STALE_MIN: ${JOB_HEARTBEAT_STALE_MIN:-5}
      REAPER_TICK_SEC: ${REAPER_TICK_SEC:-60}
      # tushare 备源 token (akshare 主源无需 token)
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
    volumes:
      - ./data:/data                     # 全系统唯一 :rw
      - ./keeper-store:/keeper-store     # keeper.db (Job/调度队列, WAL)
      - ./logs/keeper:/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8300/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # 重型写 (compaction/migration/vacuum) 跑在进程内 ThreadPoolExecutor；
    # 定时任务由进程内调度线程投递。单写者=单实例,进程内 cron 不会重复触发。

  # ── 因子查询 (现状不变, 仅加日志上报) ────────────────────────
  factor-api:
    image: ${FACTOR_IMAGE:-ghcr.io/OWNER/REPO/factor:latest}
    container_name: zj-quant-factor-api
    restart: unless-stopped
    # OOM containment for interactive factor compute/preview. Without this a
    # single runaway compute() grew to ~20GB and segfaulted in DuckDB, dumping
    # an 8GB core into the unmapped /app layer (2026-06-01 disk-full incident).
    mem_limit: ${FACTOR_API_MEM_LIMIT:-6g}
    memswap_limit: ${FACTOR_API_MEM_LIMIT:-6g}
    # 关闭 core dump:崩溃只重启,不向宿主系统盘写出数十 G 的 core (2026-06-01 P0)。
    ulimits:
      core: 0
    depends_on:
      - data-keeper
    environment:
      <<: *logging-env
      QUANT_DATA_ROOT: /data
      # DuckDB 内存护栏：超限 spill 到 sdb(/factor-store 在 10TB 盘)而非 OOM。
      QUANT_DUCKDB_MEMORY_LIMIT: ${FACTOR_DUCKDB_MEMORY_LIMIT:-2GB}
      QUANT_DUCKDB_TEMP_DIR: /factor-store/duck_tmp
      FACTOR_STORE_ROOT: /factor-store
      FACTOR_DB_URL: sqlite:////factor-store/factor.db
      FACTOR_ROLE: api
      TRUST_PROXY_USER_HEADERS: "true"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      LOG_FILE_DIR: /logs
    volumes:
      - ./data:/data:ro
      - ./factor-store:/factor-store
      - ./logs/factor:/logs
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ── 因子计算 (worker) ────────────────────────────────────────
  factor-worker:
    image: ${FACTOR_IMAGE:-ghcr.io/OWNER/REPO/factor:latest}
    container_name: zj-quant-factor-worker
    command: ["python", "-m", "factor_service.queue.dispatcher"]
    restart: unless-stopped
    # Heaviest service: runs FACTOR_CONCURRENCY compute tasks in one cgroup.
    # This ceiling is shared across all concurrent tasks -- size it together
    # with FACTOR_CONCURRENCY. Was unbounded → 2026-06-01 core-dumps on "/".
    # FACTOR_HEAVY_CONCURRENCY caps how many *evaluations* (each peaks at multiple
    # GB of RSS — full bars_daily scan → polars) run at once: 4 concurrent OOM-
    # killed the worker (2026-06-05 basket crash-loop). Keep it × ~5GB ≲ mem_limit.
    mem_limit: ${FACTOR_WORKER_MEM_LIMIT:-12g}
    memswap_limit: ${FACTOR_WORKER_MEM_LIMIT:-12g}
    # 关闭 core dump:崩溃只重启,不向宿主系统盘写出数十 G 的 core (2026-06-01 P0)。
    ulimits:
      core: 0
    depends_on:
      - factor-api
    environment:
      <<: *logging-env
      QUANT_DATA_ROOT: /data
      # DuckDB 内存护栏：超限 spill 到 sdb(/factor-store 在 10TB 盘)而非 OOM。
      QUANT_DUCKDB_MEMORY_LIMIT: ${FACTOR_DUCKDB_MEMORY_LIMIT:-2GB}
      QUANT_DUCKDB_TEMP_DIR: /factor-store/duck_tmp
      FACTOR_STORE_ROOT: /factor-store
      FACTOR_DB_URL: sqlite:////factor-store/factor.db
      FACTOR_ROLE: worker
      FACTOR_CONCURRENCY: ${FACTOR_CONCURRENCY:-4}
      # Memory-aware admission gate (修复 worker OOM crash-loop, 2026-06-05).
      # 1 = 重评估串行(单评估峰值 ~5.4GB,12GB 上限留不出两份的余量);宿主内存富裕可调高。
      FACTOR_HEAVY_CONCURRENCY: ${FACTOR_HEAVY_CONCURRENCY:-1}
      FACTOR_RESERVE_INTERACTIVE: ${FACTOR_RESERVE_INTERACTIVE:-1}
      FACTOR_POLL_INTERVAL_MS: ${FACTOR_POLL_INTERVAL_MS:-1000}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      LOG_FILE_DIR: /logs
    volumes:
      - ./data:/data:ro
      - ./factor-store:/factor-store
      - ./logs/factor:/logs
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ── 第一层 · 心跳/基建哨兵 (外置, 可观测层重构方案 §5 / §9.1) ──────────────
  # 「看门狗住在屋外」: 只读挂 docker.sock + 宿主分区, 自主检测 L0 存活 / D1–D4 / D7 /
  # D13 磁盘 / D14 CPU / D15 core-dump, 并:
  #   ① POST /monitor/signals (v2: containers + infra + conditions) 喂后端台账;
  #   ② 暴露 :8400 只读 HTTP/SSE 状态帧, 经 nginx /obs/ 直推前端 (绕开 backend);
  #   ③ 命中先写本地 JSONL (本地优先, backend 宕机也不丢) 再 ship source=monitor 日志。
  # 谁崩它都活: 不再 depends_on web-backend (哨兵须独立于被观测者)。最小权限: 只读、无命令面。
  obs-sentinel:
    image: ${OBS_SENTINEL_IMAGE:-ghcr.io/OWNER/REPO/obs-sentinel:latest}
    container_name: zj-quant-obs-sentinel
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    # 与全栈一致: 关 core dump (哨兵自身崩溃也不写爆系统盘, 2026-06-01 P0)。
    ulimits:
      core: 0
    expose:
      - "8400"                                          # 仅供 web-frontend 反代, 不发布到宿主/公网
    environment:
      <<: *logging-env                                  # 复用 LOG_INGEST_URL / TOKEN
      MONITOR_SIGNALS_URL: http://web-backend:8000/api/v1/monitor/signals
      MONITOR_SIGNALS_TOKEN: ${LOG_INGEST_TOKEN:-change-me-log-token}
      SENTINEL_INTERVAL_SEC: ${SENTINEL_INTERVAL_SEC:-30}        # 深扫 (stats/size) 节拍
      OBS_LIVENESS_INTERVAL_SEC: ${OBS_LIVENESS_INTERVAL_SEC:-2}  # L0 存活快扫 → AC-1 ≤3s 变红
      SENTINEL_LABEL_FILTER: "com.docker.compose.project=zj-quant"
      # D1–D4 阈值 (哨兵带时间窗/持续态自检)
      RESTART_STORM_COUNT: ${RESTART_STORM_COUNT:-3}
      RESTART_STORM_WINDOW_MIN: ${RESTART_STORM_WINDOW_MIN:-10}
      UNHEALTHY_FOR_SEC: ${UNHEALTHY_FOR_SEC:-90}
      MEM_PRESSURE_PCT: ${MEM_PRESSURE_PCT:-90}
      MEM_PRESSURE_FOR_SEC: ${MEM_PRESSURE_FOR_SEC:-120}
      # 第一层新检测器阈值 (§9.2)
      DISK_WARN_PCT: ${DISK_WARN_PCT:-85}
      DISK_CRIT_PCT: ${DISK_CRIT_PCT:-95}
      CPU_SAT_PCT: ${CPU_SAT_PCT:-90}
      CPU_SAT_FOR_SEC: ${CPU_SAT_FOR_SEC:-120}
      CORE_DUMP_RW_GB: ${CORE_DUMP_RW_GB:-2}
      LIVENESS_PROBE_TIMEOUT_SEC: ${LIVENESS_PROBE_TIMEOUT_SEC:-2}
      DEADMAN_HOURS: ${DEADMAN_HOURS:-25}
      # D13 磁盘: 容器内 statvfs 路径 (宿主分区 :ro 挂在这里); 缺失的挂载自动跳过。
      OBS_DISK_MOUNTS: ${OBS_DISK_MOUNTS:-/=/host-root,/mnt/sdb=/host-sdb}
      # L0 死人开关直采 keeper /health (不再经 backend)
      KEEPER_HEALTH_URL: http://data-keeper:8300/health
      # 状态帧 HTTP/SSE 服务
      OBS_HTTP_PORT: ${OBS_HTTP_PORT:-8400}
      OBS_STATUS_PUSH_SEC: ${OBS_STATUS_PUSH_SEC:-10}
      OBS_JSONL_DIR: /logs                              # 本地 JSONL 兜底落点
      # 状态帧 JWT 本地校验 (与 backend 同密钥, 哨兵不回调 backend)
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      TZ: Asia/Shanghai
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro    # 只读, 绝不外泄到 /obs/
      - /:/host-root:ro                                 # D13 系统盘水位 (2026-06-01 P0 受害盘)
      # 数据盘 (可选, 按部署放开): 监控大盘 /mnt/sdb 水位 (core-dump 落点)。
      # - /mnt/sdb:/host-sdb:ro
      - ./logs/sentinel:/logs                           # 哨兵自身告警本地 JSONL (回填自愈源)
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8400/obs/v1/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # ── 生产自动更新 (profile: production) ────────────────────────
  watchtower:
    image: containrrr/watchtower:latest
    container_name: zj-quant-watchtower
    profiles: ["production"]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      TZ: "Asia/Shanghai"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_ROLLING_RESTART: "true"

# 全 bind 后无需顶层 volumes: 段 —— 状态全部落在 deploy/ 子目录 (V3 §2.4)。
