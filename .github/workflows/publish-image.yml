name: Build & Publish Docker Images

# 触发条件：
#   - push 到 develop 分支    → 打 :latest + :develop + :<sha>
#   - push 形如 v1.2.3 的 tag → 打 :1.2.3 + :1.2 + :<sha>
#   - Actions 页面手动触发
# 注意：main 分支不构建镜像（按团队约定，镜像从 develop 出）。
#
# 容器化重构 V3：单 web 镜像已拆为 5 个服务镜像（web-backend / web-frontend /
# data-keeper / factor）。用 matrix 分别构建推送，镜像名带服务后缀。
on:
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web-backend
            dockerfile: apps/web/backend/Dockerfile
          - service: web-frontend
            dockerfile: apps/web/frontend/Dockerfile
          - service: data-keeper
            dockerfile: apps/data-keeper/Dockerfile
          - service: factor
            dockerfile: apps/factor/Dockerfile

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          # 构建上下文 = 仓库根，因为各 Dockerfile 都需要 COPY apps/ 和 packages/
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          platforms: linux/amd64
