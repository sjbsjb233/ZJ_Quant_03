name: CI

# Run on every PR targeting the long-lived branches, and on direct pushes to them.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A newer push to the same ref cancels older in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 内存治理护栏 (方案 WP1.2 / §9.6): invariants 是离线全表扫描器,
      # 服务进程引用 = 复刻 2026-06-01 崩溃循环。与 reader.py 调用守则互为镜像
      # (注释负责"看到",这里负责"拦住")。
      - name: guard — apps/ must not reference quant_data.invariants
        run: |
          if grep -rnE "from quant_data(\.invariants| import [^#]*\binvariants\b)|quant_data\.invariants" apps/ --include="*.py"; then
            echo "::error::quant_data.invariants 禁止在服务进程引用 (内存治理方案 WP1.2)"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install all packages + services (editable, dependency order)
        run: |
          python -m pip install --upgrade pip
          bash scripts/install_dev.sh

      - name: quant_data tests
        working-directory: packages/quant_data
        run: pytest        # perf deselected by this package's pyproject addopts

      - name: quant_web API tests
        working-directory: apps/web/backend
        run: pytest

      - name: data-keeper tests
        working-directory: apps/data-keeper
        run: pytest

      - name: obs-sentinel tests
        working-directory: apps/obs-sentinel
        run: pytest

      - name: factor service tests
        working-directory: apps/factor
        run: pytest

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/frontend/package-lock.json

      - name: Install deps (clean, from lockfile)
        working-directory: apps/web/frontend
        run: npm ci

      # Building is also our guard against "fresh clone can't build" bugs
      # (e.g. a source dir accidentally caught by .gitignore).
      - name: Build SPA
        working-directory: apps/web/frontend
        run: npm run build
