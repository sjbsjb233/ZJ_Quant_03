[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-factor"
version = "0.1.0"
description = "Factor library for ZJ Quant — compute, evaluate, neutralize, correlate."
requires-python = ">=3.11"
dependencies = [
    "quant-data>=0.2.0",
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["quant_factor*"]
