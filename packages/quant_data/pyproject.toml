[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-data"
version = "0.2.0"
description = "Data layer for the multi-factor quantitative trading system (raw/reference/metadata governance, append-only + current-view, PIT, field extensibility)."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "polars>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
# quant_admission (内存治理方案 WP5) ships inside the quant-data distribution:
# every container already installs quant-data, so the admission gate is
# importable in web/keeper/factor with zero Dockerfile/compose wiring changes.
include = ["quant_data*", "quant_admission*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not perf'"
markers = [
    "unit: pure input/output contract of one function/class",
    "integration: multiple modules cooperating (ingest -> metadata -> reader)",
    "e2e: full business workflow",
    "invariant: data-quality invariant checks (doc §8)",
    "perf: performance baseline (deselected by default; run with -m perf)",
]
